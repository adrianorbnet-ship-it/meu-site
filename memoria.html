<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória Arqueológica</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    background-image: url("fundo.png");
    background-size: cover;
    background-position: center;
    margin: 0;
    padding: 0;
  }

  #cabecalho {
    background-color: rgba(255, 255, 255, 0.85);
    padding: 15px 20px;
    margin: 10px auto;
    border-radius: 10px;
    width: 90%;
    max-width: 800px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }

  #cabecalho h1 { color: #5a3e1b; margin: 0; font-size: 1.6em; }
  #cabecalho p { margin: 5px 0 0 0; color: #333; font-size: 1em; }

  #recorde {
    margin-top: 10px;
    color: #5a3e1b;
    font-weight: bold;
    font-size: 1em;
  }

  #container-jogo {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 15px;
    margin: 20px auto;
    min-height: 420px;
    width: 95%;
    max-width: 900px;
  }

 
  
  @media (max-width: 768px) {
  #container-jogo {
    flex-direction: column; /* coloca o mapa em cima e a explicação embaixo */
    align-items: center;
  }

  #caixa-explicacao {
    width: 90%;
    margin: 15px auto 0;
    order: 2;
  }

  #mapa {
    width: 95vw;
    max-width: 400px;
    height: auto;
  }

  .celula {
    aspect-ratio: 1 / 1;
  }
}
  
  
  
  
  
  


  .celula .face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 5px;
    overflow: hidden;
    transition: transform 0.4s;
  }

  .celula .frente {
    background: #d9c199;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 2vw, 22px);
  }

  .celula .verso {
    transform: rotateY(180deg);
    background-size: cover;
    background-position: center;
  }

  .virada .frente { transform: rotateY(180deg); }
  .virada .verso { transform: rotateY(0); }

  #caixa-explicacao {
    flex: 1 1 220px;
    min-width: 220px;
    max-width: 300px;
    padding: 10px;
    background: rgba(255,255,255,0.85);
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #caixa-explicacao.mostrar { opacity: 1; }

  #caixa-explicacao h3 { margin-top: 0; font-size: 1.2em; }

  #rodape {
    background-color: rgba(255, 255, 255, 0.85);
    padding: 10px 20px 20px;
    margin: 20px auto;
    border-radius: 10px;
    width: 90%;
    max-width: 800px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #painel { font-size: 1em; color: #333; margin-bottom: 10px; }

  .botao {
    margin: 5px;
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #5a3e1b;
    color: #fff;
    transition: background 0.3s;
  }

  .botao:hover { background: #7b5630; }

  /* 📱 Responsividade */
  @media (max-width: 768px) {
    #cabecalho h1 { font-size: 1.4em; }
    #mapa {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
      width: 90vw;
      max-width: 350px;
    }
    #caixa-explicacao {
      order: 3;
      margin-top: 10px;
      width: 50%;
      max-width: none;
    }
    #painel { font-size: 0.95em; }
  }

  @media (max-width: 480px) {
    #mapa {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(8, 1fr);
      max-width: 300px;
    }
    #cabecalho h1 { font-size: 1.2em; }
    #cabecalho p { font-size: 0.9em; }
    .botao { font-size: 0.9em; padding: 8px 16px; }
  }
</style>
</head>
<body>

<div id="cabecalho">
  <h1>Jogo da Memória Arqueológica</h1>
  <p>Encontre todos os pares de artefatos antes que o tempo acabe!</p>
</div>

<div id="recorde"></div>

<div id="container-jogo">
  <div id="mapa"></div>
  <div id="caixa-explicacao">
    <h3>Informações</h3>
    <p id="explicacao-texto">Vire uma carta para ver a explicação.</p>
  </div>
</div>

<div id="rodape">
  <div id="painel">
    ⏱️ Tempo: <span id="tempo">0</span>s — 🏆 Pontos: <span id="pontos">0</span>
  </div>
  <div>
    <button id="reset" class="botao">🔄 Reiniciar</button>
    <button id="voltar" class="botao">⬅️ Voltar</button>
  </div>
</div>

<audio id="som-acerto" src="acerto.mp3" preload="auto"></audio>

<script>
const mapa = document.getElementById("mapa");
const tempoEl = document.getElementById("tempo");
const pontosEl = document.getElementById("pontos");
const resetBtn = document.getElementById("reset");
const voltarBtn = document.getElementById("voltar");
const caixa = document.getElementById("caixa-explicacao");
const textoExplicacao = document.getElementById("explicacao-texto");
const somAcerto = document.getElementById("som-acerto");

let timeoutExplicacao;

const cartasInfo = [
  { img: "arca.png", referencia: "Êxodo 25:10-22", explicacao: "A Arca da Aliança guardava as tábuas da lei de Moisés e simbolizava a presença de Deus entre o povo." },
  { img: "arcanoe.png", referencia: "Gênesis 6:14-16", explicacao: "A Arca de Noé salvou Noé, sua família e os animais do dilúvio enviado por Deus." },
  { img: "bezerro.png", referencia: "Êxodo 32:1-35", explicacao: "O Bezerro de Ouro representa o pecado do povo de Israel ao adorar um ídolo enquanto Moisés estava no monte." },
  { img: "carrofarao.png", referencia: "Êxodo 14:6-9", explicacao: "O carro do faraó simboliza o poder egípcio durante a perseguição do povo de Israel." },
  { img: "casa.png", referencia: "Josué 6:24", explicacao: "A destruição das casas em Jericó é um exemplo da vitória de Israel sobre a cidade prometida por Deus." },
  { img: "chifreazeite.png", referencia: "1 Samuel 16:13", explicacao: "O chifre de azeite era usado para ungir reis e sacerdotes em cerimônias sagradas de Israel." },
  { img: "emaus.png", referencia: "Lucas 24:13-35", explicacao: "O caminho de Emaús relata o encontro de Jesus com dois discípulos após a ressurreição." },
  { img: "jerico.png", referencia: "Josué 6:1-20", explicacao: "A cidade de Jericó caiu após o povo marchar ao redor das muralhas, obedecendo às ordens de Deus." },
  { img: "manjedoura.png", referencia: "Lucas 2:7", explicacao: "A manjedoura foi o local humilde onde Jesus nasceu, mostrando sua simplicidade e humanidade." },
  { img: "pergaminho.png", referencia: "Daniel 5:25-28", explicacao: "O pergaminho trazia mensagens proféticas de Deus, como a escrita misteriosa na parede do rei Belsazar." },
  { img: "taca.png", referencia: "Mateus 26:27-28", explicacao: "A taça simboliza o sangue de Cristo durante a Última Ceia e a nova aliança com Deus." },
  { img: "templo.png", referencia: "1 Reis 6:1-38", explicacao: "O Templo de Salomão era o centro de adoração e sacrifícios a Deus, símbolo da presença divina." }
];

let cartas = [];
let primeira = null;
let segunda = null;
let bloqueado = false;
let acertos = 0;
let pontos = 0;
let tempo = 0;
let cronometro;
let jogador = "";

function mostrarRecorde() {
  const recorde = JSON.parse(localStorage.getItem("recordeMemoria"));
  if (recorde) {
    document.getElementById("recorde").innerHTML =
      `🏅 Recorde: <b>${recorde.nome}</b> — ${recorde.pontos} pts em ${recorde.tempo}s`;
  }
}

function salvarRecorde(nome, pontos, tempo) {
  const recorde = JSON.parse(localStorage.getItem("recordeMemoria"));
  if (!recorde || pontos > recorde.pontos || (pontos === recorde.pontos && tempo < recorde.tempo)) {
    localStorage.setItem("recordeMemoria", JSON.stringify({ nome, pontos, tempo }));
    alert(`🏆 Novo recorde! ${nome} marcou ${pontos} pontos em ${tempo}s!`);
    mostrarRecorde();
  }
}

function embaralhar(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function iniciarJogo() {
  if (!jogador) jogador = prompt("Digite seu nome para começar:") || "Anônimo";
  mapa.innerHTML = "";
  acertos = 0;
  pontos = 0;
  tempo = 0;
  primeira = null;
  segunda = null;
  bloqueado = true;
  pontosEl.textContent = pontos;
  tempoEl.textContent = tempo;
  caixa.classList.remove("mostrar");
  textoExplicacao.textContent = "";
  clearInterval(cronometro);

  const pares = cartasInfo.concat(cartasInfo);
  embaralhar(pares);
  cartas = pares.map((info) => criarCarta(info));

  setTimeout(() => {
    cartas.forEach(c => c.classList.add("virada"));
    setTimeout(() => {
      cartas.forEach(c => c.classList.remove("virada"));
      bloqueado = false;
      cronometro = setInterval(() => {
        tempo++;
        tempoEl.textContent = tempo;
      }, 1000);
    }, 3000);
  }, 200);
}

function criarCarta(info) {
  const cel = document.createElement("div");
  cel.classList.add("celula");
  cel.dataset.img = info.img;
  cel.dataset.ref = info.referencia;
  cel.dataset.explicacao = info.explicacao;

  const frente = document.createElement("div");
  frente.classList.add("face", "frente");
  frente.textContent = "?";

  const verso = document.createElement("div");
  verso.classList.add("face", "verso");
  verso.style.backgroundImage = `url('${info.img}')`;

  cel.appendChild(frente);
  cel.appendChild(verso);
  cel.addEventListener("click", () => virarCarta(cel));

  mapa.appendChild(cel);
  return cel;
}

function virarCarta(cel) {
  if (bloqueado || cel.classList.contains("virada") || cel.classList.contains("encontrada")) return;
  cel.classList.add("virada");

  clearTimeout(timeoutExplicacao);
  caixa.classList.add("mostrar");
  textoExplicacao.innerHTML = `${cel.dataset.explicacao}<br><b>${cel.dataset.ref}</b>`;

  if (!primeira) primeira = cel;
  else { segunda = cel; checarPar(); }
}

function checarPar() {
  bloqueado = true;
  const img1 = primeira.dataset.img;
  const img2 = segunda.dataset.img;

  if (img1 === img2) {
    acertos++;
    pontos += Math.max(100 - tempo, 10);
    pontosEl.textContent = pontos;

    somAcerto.currentTime = 0;
    somAcerto.play();

    primeira.classList.add("encontrada");
    segunda.classList.add("encontrada");

    [primeira, segunda].forEach(c => c.style.pointerEvents = "none");
    resetarSelecao();

    if (acertos === cartasInfo.length) {
      clearInterval(cronometro);
      salvarRecorde(jogador, pontos, tempo);
      setTimeout(() => {
        alert(`🏆 ${jogador}, você encontrou todos os pares!\nTempo: ${tempo}s\nPontuação: ${pontos}`);
      }, 300);
    }
  } else {
    setTimeout(() => {
      primeira.classList.remove("virada");
      segunda.classList.remove("virada");
      resetarSelecao();
    }, 800);
  }
}

function resetarSelecao() {
  [primeira, segunda] = [null, null];
  bloqueado = false;

  const cartasViradasNaoEncontradas = cartas.filter(c =>
    c.classList.contains("virada") && !c.classList.contains("encontrada")
  );

  if (cartasViradasNaoEncontradas.length === 0) {
    clearTimeout(timeoutExplicacao);
    timeoutExplicacao = setTimeout(() => {
      caixa.classList.remove("mostrar");
    }, 3000);
  }
}

/* 🔙 Função do botão Voltar */
voltarBtn.addEventListener("click", () => {
  history.back(); // volta para a página anterior
});

resetBtn.addEventListener("click", iniciarJogo);
mostrarRecorde();
iniciarJogo();
</script>

</body>

</html>
